name: Terraform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для apply'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
      action:
        description: 'Действие (plan или apply)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  TF_VERSION: 1.5.7

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.action == 'plan')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set MinIO credentials
        run: |
          echo "MINIO_ROOT_USER=${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}" >> $GITHUB_ENV
          echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}" >> $GITHUB_ENV

      - name: Start MinIO
        run: |
          docker-compose -f Task2Advanced/docker-compose.yml up -d
          sleep 10

      - name: Configure Yandex Cloud credentials
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo "YC_TOKEN=$YC_TOKEN" >> $GITHUB_ENV
          echo "YC_CLOUD_ID=$YC_CLOUD_ID" >> $GITHUB_ENV
          echo "YC_FOLDER_ID=$YC_FOLDER_ID" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_minio_endpoint: http://localhost:9000
          TF_VAR_minio_access_key: ${{ env.MINIO_ROOT_USER }}
          TF_VAR_minio_secret_key: ${{ env.MINIO_ROOT_PASSWORD }}
        run: terraform init

      - name: Terraform Plan
        working-directory: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_minio_endpoint: http://localhost:9000
          TF_VAR_minio_access_key: ${{ env.MINIO_ROOT_USER }}
          TF_VAR_minio_secret_key: ${{ env.MINIO_ROOT_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}/tfplan

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set MinIO credentials
        run: |
          echo "MINIO_ROOT_USER=${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}" >> $GITHUB_ENV
          echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}" >> $GITHUB_ENV

      - name: Start MinIO
        run: |
          docker-compose -f Task2Advanced/docker-compose.yml up -d
          sleep 10

      - name: Configure Yandex Cloud credentials
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo "YC_TOKEN=$YC_TOKEN" >> $GITHUB_ENV
          echo "YC_CLOUD_ID=$YC_CLOUD_ID" >> $GITHUB_ENV
          echo "YC_FOLDER_ID=$YC_FOLDER_ID" >> $GITHUB_ENV

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}

      - name: Terraform Init
        working-directory: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_minio_endpoint: http://localhost:9000
          TF_VAR_minio_access_key: ${{ env.MINIO_ROOT_USER }}
          TF_VAR_minio_secret_key: ${{ env.MINIO_ROOT_PASSWORD }}
        run: terraform init

      - name: Terraform Apply
        working-directory: Task2Advanced/envs/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_minio_endpoint: http://localhost:9000
          TF_VAR_minio_access_key: ${{ env.MINIO_ROOT_USER }}
          TF_VAR_minio_secret_key: ${{ env.MINIO_ROOT_PASSWORD }}
        run: terraform apply -auto-approve tfplan